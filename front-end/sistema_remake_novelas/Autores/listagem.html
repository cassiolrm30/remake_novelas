<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="../css/bootstrap_3_4_1.min.css">
	<script src="../css/jquery_3_5_1.min.js"></script>
	<script src="../carga/autores.js"></script>
	<style>
	.abas     { background-color:#FFFFFF; }
	.abas li  { float:left; }
	.aba      { width:30px; height:30px; border:solid 1px; border-radius:5px 5px 0px 0px; text-align:center; padding-top:5px; cursor:pointer; background-color:#FFFFFF; font-size:15px; font-weight:bold; float:left; }
	.ativa    { width:30px; height:30px; border:solid 1px; border-radius:5px 5px 0px 0px; text-align:center; padding-top:5px; cursor:pointer; background-color:#000000; color:#FFFFFF; border-color:#000000; float:left; }
	.selected { width:30px; height:30px; border:solid 1px; border-radius:5px 5px 0px 0px; text-align:center; padding-top:5px; cursor:pointer; background-color:#000000; color:#FFFFFF; border-color:#000000; }
	#header   { margin-left:-40px; }

	tr:nth-child(even) { background-color: #F2F2F2; }

	.tabela 		{ border: solid 1px #000000; border-collapse: collapse; border-spacing: 0; font-size: 12px; width: 100%; }
	.celulaTitulo 	{ padding: 6px; font-weight: bold; color: #FFFFFF; background-color: #000000; vertical-align: middle; cursor: pointer; }
	.celulaConteudo { padding: 4px 0px 4px 0px; vertical-align: middle; }
	.celulaAcoes 	{ padding: 6px 0px 0px 0px; font-weight: bold; color: #FFFFFF; background-color: #000000; vertical-align: top; }

	.acoes { text-align:center; margin: 0px 0px 0px 0px; }

	.paginacao 		  { padding: 5px; background-color: #000000; color: #FFFFFF; text-align: center; }
	.paginacao a 	  { padding: 0px 10px 0px 10px; background-color: #000000; color: #FFFFFF; text-decoration: none; }
	.pagina_atual 	  { padding: 1px 7px 1px 7px; background-color: #FFFFFF; color: #000000; text-decoration: none; font-weight: bold; border-radius: 3px; }
	.item_paginacao a { padding: 0px 5px 0px 5px; }
</style>
</head>
<body>
    <div class="container body-content">
		<div style="height:100%;padding-top:10px;">
			<center>
				<div id='header'></div>
				<div id="content" style="height:250px;">
					<table id="tblListagem" class="tabela"></table>
				</div>
				<div style="text-align:right;">
					<button type="button" class="btn btn-primary" style="width:100px;" id="btnNovo" onclick="javascript:window.location='cadastro.html';"> Novo </button>
				</div>
			</center>
		</div>
    </div>
    <script src="../js/funcoes_gerais.js"></script>
	<script>
		var v_ascii_inicio  = 65;
		var v_ascii_fim     = 90;
		var dados    		= [];
		var tabela, rotulos = [], larguras = [], aligns = [];
		var v_qt_linhas 	= 1;
		var	sentidosAscendente = [];

		$("#btnNovo").click(function () { window.location.href = "cadastro.html"; });

		$(document).ready(function()
		{
			rotulos  = ["", "Nome", "A&ccedil;&otilde;es"];
            larguras = ["100px", "800px", "100px"];
            aligns   = ["center", "left", "center"];
			for (var i = 0; i < rotulos.length; i++)
				sentidosAscendente.push(true);

			dados = getAutores();
			if (dados.length > 0)
			{
                montarAbasPorLetraInicial();
				$(".abas li:first div").addClass("selected");
				$(".aba").click(
					function()
					{
						$(".aba").removeClass("selected");
						$(this).addClass("selected");
						var filtro = parseInt($(this).attr("id").replace("aba",""));
						v_qt_linhas = 1;
						montarTabela(1, filtro);
					}
				);
				tabela = document.getElementById($("#content table").prop("id"));
				v_ascii_inicio = dados[0].Nome.charCodeAt(0);
				montarTabela(1, v_ascii_inicio);
			}
		});
	</script>
</body>
</html>
