        function preencherCombo(opcao)
        {
            var idCombo = "";
            var v_option = new Option("-- Selecione --", "");
			if (opcao == 6)
			{
				jQuery.ajax
				({
					type: "GET",
					dataType: "json",
					url: "https://servicodados.ibge.gov.br/api/v1/localidades/estados/",
					async: false,
					success: function (data)
					{
						$("#cboUF").append(v_option);
						for (var i = 0; i < data.length; i++)
						{
							v_option = new Option(data[i].sigla + " - " + data[i].nome.toUpperCase(), data[i].sigla);
							$("#cboUF").append(v_option);
						}
						v_option = new Option("EXTERIOR", "EXTERIOR");
						$("#cboUF").append(v_option);
					},
					error: function (data) { },
				});
			}
			else
			{
				const enums = GETENUMS();
				let itens;
				switch (opcao)
				{
					case 1: idCombo = "Genero"; 	   itens = enums.dados.GENERO; 		   break;
					case 2: idCombo = "Etnia"; 		   itens = enums.dados.ETNIA; 		   break;
					case 3: idCombo = "FaixaEtaria";   itens = enums.dados.FAIXA_ETARIA;   break;
					case 4: idCombo = "FaixaPeso"; 	   itens = enums.dados.FAIXA_PESO; 	   break;
					case 5: idCombo = "FaixaEstatura"; itens = enums.dados.FAIXA_ESTATURA; break;
				}
                $("#div" + idCombo).html("<select id='cbo"+idCombo+"' class='combo'></select>");
				$("#cbo" + idCombo + " option").remove();
                $("#cbo" + idCombo).prop("disabled", (itens.length == 0));
				let v_option = new Option("-- Selecione --", "");
                $("#cbo" + idCombo).append(v_option);
				for (const [chave, valor] of Object.entries(itens))
				{
					const _valor = (opcao == 1 || opcao == 2 ? valor : valor.descricao);
					$("#cbo" + idCombo).append(new Option(_valor, _valor));
				}
			}
        }

        function getCidades(p_UF)
        {
            if (p_UF == "EXTERIOR")
                $("#divCidadeNatal").html("<input type='text' id='cboCidadeNatal' name='cboCidadeNatal' class='campo_texto' style='width:100%;'>");
            else
            {
                $("#divCidadeNatal").html("<select id='cboCidadeNatal' class='combo'></select>");
                $("#cboCidadeNatal option").remove();
                jQuery.ajax
                ({
                    type: "GET",
                    dataType: "json",
                    url: "https://servicodados.ibge.gov.br/api/v1/localidades/estados/" + p_UF + "/municipios",
                    async: false,
                    success: function (data)
                    {
                        var v_option = new Option("-- Selecione --", "");
                        $("#cboCidadeNatal").append(v_option);
                        if (data.length == 0)
                            $("#cboCidadeNatal").prop("disabled", true);
                        else
                        {
                            for (var i = 0; i < data.length; i++)
                            {
                                v_option = new Option(data[i].nome.toUpperCase(), data[i].nome.toUpperCase());
                                $("#cboCidadeNatal").append(v_option);
                            }
                            $("#cboCidadeNatal").index(0);
                            $("#cboCidadeNatal").focus();
                        }
                    },
                    error: function (data) { },
                });
            }
        }

        function uploadFoto(input)
        {
            if (input.value == "")
            {
                alert("É necessário selecionar uma imagem.");
                return;
            }
            var reader = new FileReader();
            reader.onload = function (e)
            {
                $("#imgAutor").attr("src", e.target.result);
                $("#hidConteudoArquivo").val(e.target.result);
            };
            reader.readAsDataURL(input.files[0]);
        }

        function uploadImagem()
        {
            if (event.target.files != null && event.target.files.length != 0)
            {
                var arquivoSelecionado = event.target.files[0];
                var formData = new FormData();
                formData.append("minhaImagem", arquivoSelecionado);
                var xhr = new XMLHttpRequest();
                xhr.open("POST", "/Autor/post", true);
                xhr.send(formData);
            }
        }

        function getAutor(id)
        {
			const registro = GET(id);
			if (registro.mensagem != null)
				alert(registro.mensagem);
			else
			{
				const _dados = registro.dados;
				$("#Id").val(_dados._id);
				$("#txtNomeArtistico").val(_dados.nomeArtistico);
				$("#txtCPF").val(_dados.pessoa.CPF);
				$("#PessoaId").val(_dados.pessoa._id);
				$("#txtNomeCompleto").val(_dados.pessoa.nomeCompleto);
				$("#txtDataNascimento").val(_dados.pessoa.dataNascimento.substring(0, 10));
				if (_dados.pessoa.dataFalecimento != null)
					$("#txtDataFalecimento").val(_dados.pessoa.dataFalecimento.substring(0, 10));
				$("#cboGenero").val(_dados.pessoa.genero);
				$("#cboEtnia").val(_dados.pessoa.etnia);
				$("#cboFaixaEtaria").val(_dados.pessoa.faixaEtaria);
				$("#cboFaixaPeso").val(_dados.pessoa.faixaPeso);
				$("#cboFaixaEstatura").val(_dados.pessoa.faixaEstatura);
				$("#cboUF").val(_dados.pessoa.UF);
				getCidades($("#cboUF").val());
				$("#cboCidadeNatal").val(_dados.pessoa.cidadeNatal);
				$("#imgAutor").attr("src", "../imagens/" + (_dados.pessoa.imagemFoto == null ? "SEM_FOTO.jpg" : "Autores/" + _dados.pessoa.imagemFoto));

				//let versoesNovelasDoAutor = getVersoesNovelas("A", id);
				let listaNovelas = "";
				listaNovelas += "<ul style='padding-left:20px;'>";
				for (let i = 0; i < _dados.versoesNovelas.length; i++)
				{
					listaNovelas += "<li>";
					listaNovelas += "<a href='#' style='font-weight:bold;color:#000;'>" + _dados.versoesNovelas[i].titulo + " (" + _dados.versoesNovelas[i].dataLancamento + ")</a>";
					listaNovelas += "</li>";
				}
				listaNovelas += "</ul>";
				$("#divNovelas").html(listaNovelas);
			}
        }
