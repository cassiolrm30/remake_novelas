    <style>
        #header { margin-left: 60px; }

        #content 
        {
            padding-left: 100px;
            padding-right: 100px;
        }

        .tabela 
        {
            border: solid 1px black;
            border-collapse: collapse;
            border-spacing: 0;
            font-family: Arial;
            font-size: 12px;
            width: 570px;
        }

        tr:nth-child(even) { background-color: #F2F2F2; }

        .celulaTitulo 
        {
            padding: 6px;
            font-weight: bold;
            color: white;
            background-color: black;
            vertical-align: middle;
        }

        .celulaConteudo 
        {
            padding: 4px 0px 4px 0px;
            vertical-align: middle;
            cursor: pointer;
        }

        .paginacao
        {
            background-color: black;
            color: white;
            text-align: center;
            padding: 5px;
        }

        .paginacao a 
        {
            text-decoration: none;
            padding: 0px 10px 0px 10px;
            color: white;
            background-color: black;
        }

        .pagina_atual
        {
            text-decoration: none;
            padding: 1px 7px 1px 7px;
            color: black;
            background-color: white;
            font-weight: bold;
            border-radius: 3px;
        }

        img { vertical-align: middle; }

        .img_tamanho_normal 
        {
            width: 237px;
            height: 300px;
            border: solid 1px black;
        }

        .slideshow-container 
        {
            position: relative;
            margin: auto;
        }

        .prev, .next 
        {
            left: 0;
            cursor: pointer;
            top: 50%;
            width: auto;
            padding: 10px;
            font-weight: bold;
            border-radius: 5px 0px 0px 5px;
            background-color: black;
            color: white;
        }

        .next
        {
            right: 0;
            border-radius: 0px 5px 5px 0px;
        }

        .prev:hover, .next:hover { background-color: rgba(0,0,0,0.8); }

        .text
        {
            color: #f2f2f2;
            font-size: 15px;
            padding: 8px 12px;
            position: absolute;
            bottom: 8px;
            width: 100%;
            text-align: center;
        }

        .fade
        {
            -webkit-animation-name: fade;
            -webkit-animation-duration: 15s;
            animation-name: fade;
            animation-duration: 15s;
        }

        @-webkit-keyframes fade 
        {
            from { opacity: .4 }

            to { opacity: 1 }

        @keyframes fade

            from { opacity: .4 }

        function montarTabela(p_pagina_atual)
        {
            $("#tblListagem tr").remove(); // reinicializar a tabela
            var linha = tabela.insertRow(0);
            // Definindo o título da cada coluna da tabela
            for (var i = 0; i < rotulos.length; i++)
            {
                var celulaTitulo = linha.insertCell(i);
                celulaTitulo.id = "T" + (i + 1);
                celulaTitulo.className = "celulaTitulo";
                celulaTitulo.innerHTML = rotulos[i];
                celulaTitulo.style.width = larguras[i];
                celulaTitulo.style.textAlign = aligns[i];
                if (celulaTitulo.style.textAlign == "left")
                    celulaTitulo.style.paddingLeft = "5px";
                if (celulaTitulo.style.textAlign == "right")
                    celulaTitulo.style.paddingRight = "5px";
            }

            // Definindo o corpo da tabela
            var v_qt_paginas   = (dados.length / v_qt_registros_por_pagina).toFixed(0);
            var pagina_inicio  = (p_pagina_atual - 1) * v_qt_registros_por_pagina;
            var pagina_fim     = pagina_inicio + v_qt_registros_por_pagina;
            var dadosPaginados = dados.slice(pagina_inicio, pagina_fim).reverse();
            for (var i = 0; i < dadosPaginados.length; i++)
            {
                var celulas = [];
                celulas.push(dadosPaginados[i].Personagem + "|left");
                for (var j = 0; j < dadosPaginados[i].Atores.length; j++)
                {
                    var dadosAtor = dadosPaginados[i].Atores[j].split(';');
                    celulas.push(dadosAtor[0] + "|left");
                }
                v_qt_linhas = 1;
                var linha = tabela.insertRow(v_qt_linhas);
                linha.onmouseover = function () { this.style.backgroundColor = "yellow"; };
                linha.onmouseout  = function () { this.style.backgroundColor = (i % 2 == 0 ? "#F2F2F2" : ""); };
                linha.onclick     = function () { indexSlide(p_pagina_atual, this.rowIndex); };

                for (var j = 0; j < celulas.length; j++)
                {
                    var dadosConteudo = celulas[j].split('|');
                    var celula = linha.insertCell(j);
                    celula.id = "C" ;
                    celula.className = "celulaConteudo";
                    celula.innerHTML = dadosConteudo[0];
                    celula.style.textAlign = dadosConteudo[1];
                    if (celula.style.textAlign == "left")
                        celula.style.paddingLeft = "5px";
                    if (celula.style.textAlign == "right")
                        celula.style.paddingRight = "5px";
                }
                v_qt_linhas++;
            }

            // Definindo a linha da paginação
            var linha = tabela.insertRow(dadosPaginados.length + 1);
            var celula = linha.insertCell(0);
            celula.className = "paginacao";
            $("td.paginacao").prop("colspan", rotulos.length);

            var paginacao = "";
            var v_qt_paginas = (dados.length / v_qt_registros_por_pagina).toFixed(0);
            if (dados.length % v_qt_registros_por_pagina)
                v_qt_paginas++;
            if (v_qt_paginas <= 1)
                paginacao += "<span style='padding:6px;'></span>";
            else
            {
                for (var i = 1; i <= v_qt_paginas; i++)
                {
                    if (i == p_pagina_atual)
                        paginacao += "<span class='pagina_atual'>" + p_pagina_atual + "</span>";
                    else
                    {
                        v_qt_linhas = 1;
                        paginacao += "<a href='#' onclick='montarTabela(" + i + ");'>" + i + "</a>";
                    }
                }
            }
            $("td.paginacao").html(paginacao);
            v_pagina_atual = p_pagina_atual;
        }

        function createSlide() 
        {
            var conteudo = "";
            conteudo += "<div class='slideshow-container'>";
            for (var i = 0; i < dados.length; i++)
            {
                var nome_personagem = dados[i].Personagem;
                conteudo += "<div class='mySlides'>";
                conteudo += "<div class='row'>";
                conteudo += "<div class='col-12' style='border:font-family:Arial;font-weight:bold;background-color:black;color:white;font-size:11px;padding:5px;width:100%;text-align:center;float:left;border-radius:3px 3px 0px 0px;'>" + nome_personagem + "</div>";
                conteudo += "</div>";
                if (qtdVersoes == 2)
                {
                    var dados_ator1 = dados[i].Atores[0].split(';');
                    var dados_ator2 = dados[i].Atores[1].split(';');
                    conteudo += "<div class='row'>";
                    conteudo += "<div class='col-6' style='font-family:Arial;font-weight:bold;background-color:gray;color:white;font-size:11px;padding:5px;width:50%;text-align:center;border-radius:0px 0px 0px 3px;float:left;'>" + dados_ator1[0] + "</div>";
                    conteudo += "<div class='col-6' style='font-family:Arial;font-weight:bold;background-color:gray;color:white;font-size:11px;padding:5px;width:50%;text-align:center;border-radius:0px 0px 3px 0px;float:right;'>" + dados_ator2[0] + "</div>";
                    conteudo += "</div>";
                    conteudo += "<div class='row'>";
                    conteudo += "<div class='col-2' style='float:left;padding-top:25px;width:5%;'><a class='prev' onclick='plusSlides(-1);'>&#10094;</a></div>";
                    conteudo += "<div class='col-4' style='float:left;border:solid 1px;width:45%;text-align:center;'><img src='../imagens/" + dados_ator1[1] + "' title='" + dados_ator1[0] + "' class='img_tamanho_normal'></div>";
                    conteudo += "<div class='col-4' style='float:left;border:solid 1px;width:45%;text-align:center;'><img src='../imagens/" + dados_ator2[1] + "' title='" + dados_ator2[0] + "' class='img_tamanho_normal'></div>";
                    conteudo += "<div class='col-2' style='float:right;padding-top:25px;width:5%;'><a class='next' onclick='plusSlides(1);'>&#10095;</a></div>";
                    conteudo += "</div>";
                }
                conteudo += "</div>";
            }
            conteudo += "</div>";
            document.getElementById("divSlides").innerHTML = conteudo;
        }

        function showSlides(n) 
        {
            var i;
            var slides = document.getElementsByClassName("mySlides");
            if (n > slides.length) { slideIndex = 1 }
            if (n < 1) { slideIndex = slides.length }
            for (i = 0; i < slides.length; i++)
                slides[i].style.display = "none";
            slides[slideIndex - 1].style.display = "block";
        }

        function plusSlides(n) { showSlides(slideIndex += n); }

        function currentSlide(n) { showSlides(slideIndex = n); }

        function indexSlide(pagina_atual, n) { showSlides(slideIndex = (((pagina_atual - 1) * 10) + n)); }
