			function obterListagemSelecionada(opcao)
			{
				var tabelaEditavel;
				switch (opcao)
				{
					case 1:  tabelaEditavel = listagemVersoes; break;
					case 2:  tabelaEditavel = listagemPersonagens; break;
					default: tabelaEditavel = null;
				}
				return tabelaEditavel;
			}

			function validarItemListagem(opcao)
			{
				if (opcao == 1)
				{
					// 3 campos de nova versão
					var idDataLancamento = "#campoEdicao" + opcao + "-2";
                    var valorCampoEdicaoValidoAutor = $("#campoEdicao" + opcao + "-1").val().length == 0;
                    var valorCampoEdicaoValidoDataLancamento = $("#campoEdicao" + opcao + "-2").val().length == 0;
                    var valorCampoEdicaoValidoQtdCapitulos = $("#campoEdicao" + opcao + "-3").val().length == 0;
					if (valorCampoEdicaoValidoAutor || valorCampoEdicaoValidoDataLancamento || valorCampoEdicaoValidoQtdCapitulos)
					{
                        alert("Todos os campos da nova versão devem ser preenchidos.");
                        $("#campoEdicao" + opcao + "-1").focus();
						return false;
					}
                    if ($("#cboAutor").val() == "" || $("#txtDataLancamento").val() == "" || $("#txtQtdCapitulos").val().trim() == "" || parseInt($("#txtQtdCapitulos").val().trim()) == 0)
					{
                        alert("Todos os campos da versão original devem ser antes preenchidos.");
                        $("#campoEdicao" + opcao + "-1").focus();
                        return false;
                    }
                    if ($(idDataLancamento).val() <= $("#txtDataLancamento").val())
                    {
                        alert("A data de lançamento deve ser maior que a da versão original.");
                        $(idDataLancamento).focus();
                        return false;
					}

                    //debugger;
					var edicao = false;
					for (var i = 0; i < listagemVersoes.DadosDaLinhaEmEdicao.length; i++)
					{
                        if ($(idDataLancamento).val() == listagemVersoes.DadosDaLinhaEmEdicao[i])
						{
							edicao = true;
							break;
                        }
					}
					if (!edicao)
					{
						datasVersoesExistentes = [];
						$("#tblVersoes td[id='CC1-2']").each(function (index)
						{
							if (index > 0)
								datasVersoesExistentes.push(listagemVersoes.getDataFormatada($(this).text(), false));
						});
						//debugger;
						if (listagemVersoes.PosicaoDaLinhaEmEdicao == -1)
						{
							for (var i = 0; i < datasVersoesExistentes.length; i++)
							{
								if ($(idDataLancamento).val() <= datasVersoesExistentes[i])
								{
									alert("A data de lançamento deve ser maior que todas as demais.");
									$(idDataLancamento).focus();
									return false;
								}
							}
                        }
					}
                    // Em caso de edição, adicionar "0" ao array de versões existentes
					if (dadosCadastro.Id != 0)
						idsVersoesExistentes.push("0");
				}
				else
				{
					// 6 campos de novo personagem
					for (var i = 0; i <= 5; i++)
					{
						if ($("#campoEdicao2-" + i).val().length == 0)
						{
							alert("Todos os campos do novo personagem devem ser preenchidos.");
                            $("#campoEdicao" + opcao + "-" + i).focus();
                            return false;
                        }
					}
					// Em caso de edição, adicionar "0" ao array de personagens existentes
                    if (dadosCadastro.Id != 0)
						idsPersonagensExistentes.push("0");
				}
				return true;
            }

                if (validarItemListagem(opcao))
				{
                    if (tabelaEditavel.PosicaoDaLinhaEmEdicao == -1)
                        tabelaEditavel.incluirLinha(null);
					else
					{
						tabelaEditavel.alterarLinha(tabelaEditavel.PosicaoDaLinhaEmEdicao);
						console.log(dadosCadastro.dadosPersonagens);
						//debugger;
					}
                    $("#btnSalvar").attr("disabled", false);
                }
			}

			function editarLinha(opcao, rowIndex)
			{
				var tabelaEditavel = obterListagemSelecionada(opcao);
				tabelaEditavel.editarLinha(rowIndex);
                $("#btnSalvar").attr("disabled", true);
			}

			function cancelarEdicao(opcao, linha)
			{
				var tabelaEditavel = obterListagemSelecionada(opcao);
				tabelaEditavel.cancelarEdicao(linha);
                $("#btnSalvar").attr("disabled", false);
			}

            function excluirLinha(opcao, r)
			{
				if (confirm("Tem certeza que deseja excluir este registro?"))
				{
					//debugger;
                    var tabelaEditavel = obterListagemSelecionada(opcao);
					var pos = r - 2;
					tabelaEditavel.excluirLinha(r);
					if (dadosCadastro.Id == 0) return;
					var id = "0";
					if (opcao == 1)
					{
						if (dadosCadastro.DadosVersoes[pos] != null)
						{
                            var dadosItem = dadosCadastro.DadosVersoes[pos].split('|');
                            id = dadosItem[dadosItem.length - 1];
                        }
					}
					else
					{
                        if (dadosCadastro.DadosPersonagens[pos] != null)
						{
							var dadosItem = dadosCadastro.DadosPersonagens[pos].split('|');
							var id = dadosItem[dadosItem.length - 1];
						}
					}
					if (id != "0")
					{
						idsVersoesExistentes = [];
						idsPersonagensExistentes = [];
						getNovela($("#Id").val());
                    }
                }
            }

			function getAutores()
			{
				for (var i = 0; i < autores.length; i++)
				{
					var option   = document.createElement("option");
					//option.value = autores[i].nomeArtistico.toUpperCase();
					option.value = autores[i].id;
					option.text  = autores[i].nomeArtistico.toUpperCase();
					document.getElementById("cboAutor").add(option);
				}
            }

			function getNovela(id)
			{
				let _novelas = novelas.filter((n) => n.id == id);
				if (_novelas == null)
				{
					alert ("Erro na consulta.");
					return;
				}
				let _novela = _novelas[0];
				let _dados;
				_novela.versoesNovelas = getVersoesNovelas("N", id);
				_novela.personagens = getPersonagens("N", id);

				$("#Id").val(_novela.id);
				$("#txtTitulo").val(_novela.titulo);
				$("#txtSinopse").val(_novela.sinopse);

				dadosCadastro.Id = $("#Id").val();
				dadosCadastro.Titulo = $("#txtTitulo").val();
				dadosCadastro.Sinopse = $("#txtSinopse").val();
				
				listagemVersoes.Carga = [];
				for (var i = 0; i < _novela.versoesNovelas.length; i++)
				{
					let _nomeAutor = autores[0].nomeArtistico.toUpperCase();
					if (i == 0)
					{
						const _versaoAtual = _novela.versoesNovelas[0];
						$("#cboAutor").val(_versaoAtual.autorId);
						$("#txtDataLancamento").val(_versaoAtual.dataLancamento);
						$("#txtQtdCapitulos").val(_versaoAtual.qtdCapitulos);
					}
					let item = _novela.versoesNovelas[i];
					let posicao = (i+1) + "ª";
					dadosCadastro.DadosVersoes.push({
													  "posicao": posicao, 
													  "nome": _nomeAutor, 
													  "dataLancamento": item.dataLancamento,
													  "qtdCapitulos": item.qtdCapitulos,
													  "id": item.id
													});
					idsVersoesExistentes.push(item.id);
					datasVersoesExistentes.push(item.dataLancamento);
					listagemVersoes.Carga.push(posicao+"|"+_nomeAutor+"|"+listagemVersoes.getDataFormatada(item.dataLancamento, true)+"|"+item.qtdCapitulos+"|"+item.id);
				}

				listagemPersonagens.Carga = [];
				for (var i = 0; i < _novela.personagens.length; i++)
				{
					let item = _novela.personagens[i];
					let _genero = "", _etnia = "", _faixaEtaria = "", _faixaPeso = "", _faixaEstatura = "";
					for (var j = 0; j < itensComboGeneros.length; j++)
					{
						_dados = itensComboGeneros[j].split('|');
						if (_dados[0] == item.generoId)	{ _genero = _dados[1]; break; }
					}
					for (var j = 0; j < itensComboEtnias.length; j++)
					{
						_dados = itensComboEtnias[j].split('|');
						if (_dados[0] == item.etniaId)	{ _etnia = _dados[1]; break; }
					}
					for (var j = 0; j < itensComboFaixasEtarias.length; j++)
					{
						_dados = itensComboFaixasEtarias[j].split('|');
						if (_dados[0] == item.faixaEtariaId)	{ _faixaEtaria = _dados[1]; break; }
					}
					for (var j = 0; j < itensComboFaixasPeso.length; j++)
					{
						_dados = itensComboFaixasPeso[j].split('|');
						if (_dados[0] == item.faixaPesoId)	{ _faixaPeso = _dados[1]; break; }
					}
					for (var j = 0; j < itensComboFaixasEstatura.length; j++)
					{
						_dados = itensComboFaixasEstatura[j].split('|');
						if (_dados[0] == item.faixaEstaturaId)	{ _faixaEstatura = _dados[1]; break; }
					}
					dadosCadastro.DadosPersonagens.push({ "id": item.id,
														  "nome": item.nome, 
														  "genero": _genero, "etnia": _etnia, "faixaEtaria": _faixaEtaria, "faixaPeso": _faixaPeso, "faixaEstatura": _faixaEstatura
														});
					idsPersonagensExistentes.push(item.id);
					listagemPersonagens.Carga.push(item.nome + "|"+_genero+"|"+_etnia+"|"+_faixaEtaria+"|"+_faixaPeso+"|"+_faixaEstatura+"|"+item.id);
				}
            }

			function montarCombo(opcao)
			{
				let data, resultado = "";
				switch (opcao)
				{
					case 1: nome = "Genero"; 	    data = itensComboGeneros; 		 break;
					case 2: nome = "Etnia"; 		data = itensComboEtnias; 		 break;
					case 3: nome = "FaixaEtaria";   data = itensComboFaixasEtarias;  break;
					case 4: nome = "FaixaPeso";     data = itensComboFaixasPeso; 	 break;
					case 5: nome = "FaixaEstatura"; data = itensComboFaixasEstatura; break;
					case 6: nome = "VersaoAutor"; 	data = autores;					 break;
				}
				resultado += "<select>";
				resultado += "<option value=''>-- Selecione --</option>";
				if (opcao == 6)
				{
					for (var i = 0; i < data.length; i++)
					{
						var nomeAutor = data[i].nomeArtistico.toUpperCase();
						resultado += "<option value='" + nomeAutor + "'>" + nomeAutor + "</option>";
					}
				}
				else
				{
					for (var i = 0; i < data.length; i++)
					{
						var dadosItem = data[i].split('|');
						resultado += "<option value='" + dadosItem[1] + "'>" + dadosItem[1] + "</option>";
					}
				}
				resultado += "</select>";
				return resultado;
			}

            function setNovela()
			{
                const ID = ($("#Id").val() != "") ? parseInt($("#Id").val()) : 0;
				if ($("#txtTitulo").val().trim() == "")
				{
                    alert("É necessário preencher o título.");
                    $("#txtTitulo").focus();
                    return;
                }
                if ($("#txtSinopse").val().length > 4000)
				{
                    alert("Sinopse deve ter no máximo 4000 caracteres.\nDevem ser retirados pelo menos " + ($("#txtSinopse").val().length - 4000) + " caracter(es).");
                    $("#txtSinopse").focus();
                    return;
                }
				if ($("#cboAutor").val() == 0)
				{
                    alert("É necessário preencher o autor.");
                    $("#cboAutor").focus();
                    return;
                }
				if ($("#txtDataLancamento").val() == "")
				{
                    alert("É necessário preencher a data de lançamento.");
                    $("#txtDataLancamento").focus();
                    return;
                }
				if ($("#txtQtdCapitulos").val().trim() == "" || parseInt($("#txtQtdCapitulos").val().trim()) == 0)
				{
                    alert("É necessário preencher a quantidade de capítulos.");
                    $("#txtQtdCapitulos").focus();
                    return;
                }
				if (parseInt($("#txtQtdCapitulos").val().trim()) > 999)
				{
                    alert("A novela deve ter no máximo 999 capítulos.");
                    $("#txtQtdCapitulos").focus();
                    return;
				}
				let valoresDatasVersoes = $("#tblVersoes td[id='CC1-2'][class='celulaConteudo']");
				if (valoresDatasVersoes.length > 0)
				{
                    datasVersoesExistentes = [];
                    datasVersoesExistentes.push($("#txtDataLancamento").val());
                    for (var i = 0; i < valoresDatasVersoes.length; i++)
                        datasVersoesExistentes.push(listagemVersoes.getDataFormatada(valoresDatasVersoes[i].innerText, false));
					for (var i = 0; i < datasVersoesExistentes.length; i++)
					{
                        if (datasVersoesExistentes[i + 1] !== undefined && datasVersoesExistentes[i] > datasVersoesExistentes[i + 1]) {
                            alert("As datas das versões de novela se encontram desordenadas.");
                            return;
                        }
                    }
                }
                if ($("#tblPersonagens tr").length <= 2)
				{
                    alert("É necessário incluir pelo menos um personagem.");
                    return;
                }

                var linhas, dados = "";
                dadosCadastro.ID = ID;
				dadosCadastro.Titulo = $("#txtTitulo").val().trim();
				dadosCadastro.Sinopse = $("#txtSinopse").val().trim();
				dadosCadastro.DadosVersoes = [];
				linhas = $("#tblVersoes tr");
				for (let i = 2; i < linhas.length; i++)
				{
					let _id = idsVersoesExistentes[i-2]; //linhas[i].cells[4].innerText;
					let _autorId = "0";
					for (let j = 0; j < autores.length; j++)
					{ if (autores[j].nomeArtistico.toUpperCase().indexOf(linhas[i].cells[1].innerText) != -1) { _autorId = autores[j].id; break; }}
					let _dataLancamento = listagemVersoes.getDataFormatada(linhas[i].cells[2].innerText, false);
					let _qtdCapitulos = linhas[i].cells[3].innerText;
					dadosCadastro.DadosVersoes.push({
														"id": _id,
														"dataLancamento": _dataLancamento, "qtdCapitulos": _qtdCapitulos, "autorId": _autorId,
														"versaoOriginalId": dadosCadastro.ID, "imagemLogotipo": null, "elencoCompleto": true
													});
				}
				dadosCadastro.DadosPersonagens = [];
				linhas = $("#tblPersonagens tr");
				for (var i = 2; i < linhas.length; i++)
				{
					let _id = idsPersonagensExistentes[i-2]; //linhas[i].cells[linhas[i].cells.length-1].innerText;
					let _nome = linhas[i].cells[0].innerText.toUpperCase();
					let _generoId = "0", _etniaId = "0", _faixaEtariaId = "0", _faixaPesoId = "0", _faixaEstaturaId = "0";

					for (let j = 0; j < itensComboGeneros.length; j++)
					{ if (itensComboGeneros[j].toUpperCase().indexOf(linhas[i].cells[1].innerText.toUpperCase()) != -1) { let dados1 = itensComboGeneros[j].split('|'); _generoId = dados1[0]; break; }}
					for (let j = 0; j < itensComboEtnias.length; j++)
					{ if (itensComboEtnias[j].toUpperCase().indexOf(linhas[i].cells[2].innerText.toUpperCase()) != -1) { let dados2 = itensComboEtnias[j].split('|'); _etniaId = dados2[0]; break; }}
					for (let j = 0; j < itensComboFaixasEtarias.length; j++)
					{ if (itensComboFaixasEtarias[j].toUpperCase().indexOf(linhas[i].cells[3].innerText.toUpperCase()) != -1) { let dados3 = itensComboFaixasEtarias[j].split('|'); _faixaEtariaId = dados3[0]; break; }}
					for (let j = 0; j < itensComboFaixasPeso.length; j++)
					{ if (itensComboFaixasPeso[j].toUpperCase().indexOf(linhas[i].cells[4].innerText.toUpperCase()) != -1) { let dados4 = itensComboFaixasPeso[j].split('|'); _faixaPesoId = dados4[0]; break; }}
					for (let j = 0; j < itensComboFaixasEstatura.length; j++)
					{ if (itensComboFaixasEstatura[j].toUpperCase().indexOf(linhas[i].cells[5].innerText.toUpperCase()) != -1) { let dados5 = itensComboFaixasEstatura[j].split('|'); _faixaEstaturaId = dados5[0]; break; }}
					dadosCadastro.DadosPersonagens.push({
															"id": _id, "nome": _nome, "generoId": _generoId, "etniaId": _etniaId, "faixaEtariaId": _faixaEtariaId,
															"faixaPesoId": _faixaPesoId, "faixaEstaturaId": _faixaEstaturaId, "generoObrig": false, "etniaObrig": false,
															"faixaEtariaObrig": false, "faixaPesoObrig": false, "faixaEstaturaObrig": false, "novelaId": dadosCadastro.ID,
															"novela": null, "atores": null
														});
				}
				idsVersoesExistentes.splice(0, idsVersoesExistentes.length);
				idsPersonagensExistentes.splice(0, idsPersonagensExistentes.length);
				datasVersoesExistentes.splice(0, datasVersoesExistentes.length);
				console.log(dadosCadastro);
				debugger;
				alert("Operação realizada com sucesso.");
				window.location.href = "listagem.html";
			}

            $("#btnSalvar").click(function () { setNovela(); });

			$("#btnCancelar").click(function () { window.location.href = "listagem.html"; });
