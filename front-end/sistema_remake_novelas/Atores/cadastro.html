        function preencherCombo(opcao)
        {
            var idCombo = "";
            var v_option = new Option("-- Selecione --", "");
			if (opcao == 6)
			{
				jQuery.ajax
				({
					type: "GET",
					dataType: "json",
					url: "https://servicodados.ibge.gov.br/api/v1/localidades/estados/",
					async: false,
					success: function (data)
					{
						$("#cboUF").append(v_option);
						for (var i = 0; i < data.length; i++)
						{
							v_option = new Option(data[i].sigla + " - " + data[i].nome.toUpperCase(), data[i].sigla);
							$("#cboUF").append(v_option);
						}
						v_option = new Option("EXTERIOR", "EXTERIOR");
						$("#cboUF").append(v_option);
					},
					error: function (data) { },
				});
			}
			else
			{
				var itens;
				switch (opcao)
				{
					case 1: idCombo = "cboGenero"; 		  itens = itensComboGeneros; 		break;
					case 2: idCombo = "cboEtnia"; 		  itens = itensComboEtnias; 		break;
					case 3: idCombo = "cboFaixaEtaria";   itens = itensComboFaixasEtarias; 	break;
					case 4: idCombo = "cboFaixaPeso"; 	  itens = itensComboFaixasPeso; 	break;
					case 5: idCombo = "cboFaixaEstatura"; itens = itensComboFaixasEstatura; break;
				}
				$("#" + idCombo).append(v_option);
				for (var i = 0; i < itens.length; i++)
				{
					var dadosItem = itens[i].split('|');
					v_option = new Option(dadosItem[1], dadosItem[0]);
					$("#" + idCombo).append(v_option);
				}
			}
        }

        function getIdade(data_nascimento, data_falecimento)
        {
            var ano_final, mes_final, dia_final;
            var dados_data_nascimento = data_nascimento.split('-');
            var ano_nascimento = parseInt(dados_data_nascimento[0]),
                mes_nascimento = parseInt(dados_data_nascimento[1] - 1),
                dia_nascimento = parseInt(dados_data_nascimento[2]);

            if (data_falecimento == null)
            {
                var data_final = new Date;
                ano_final = data_final.getFullYear();
                mes_final = data_final.getMonth() + 1;
                dia_final = data_final.getDate();
            }
            else
            {
                var dados_data_falecimento = data_falecimento.split('-');
                ano_final = parseInt(dados_data_falecimento[0]);
                mes_final = parseInt(dados_data_falecimento[1] - 1);
                dia_final = parseInt(dados_data_falecimento[2]);
            }
            var idade = ano_final - ano_nascimento;
            if (mes_final < mes_nascimento || mes_final == mes_nascimento && dia_final < dia_nascimento)
                idade--;
            return idade < 0 ? 0 : idade;
        }

        function getFaixaEtaria()
        {
            var idade = getIdade($("#txtDataNascimento").val(), ($("#txtDataFalecimento").val() == "" ? null : $("#txtDataFalecimento").val()));
            if (idade < 10)
            {
                $("#hidFaixaEtaria").val("1");
                $("#spanFaixaEtaria").html("Até 10 anos");
                return;
            }
            if (idade >= 11 && idade <= 20)
            {
                $("#hidFaixaEtaria").val("2");
                $("#spanFaixaEtaria").html("11 a 20 anos");
                return;
            }
            if (idade >= 21 && idade <= 30)
            {
                $("#hidFaixaEtaria").val("3");
                $("#spanFaixaEtaria").html("21 a 30 anos");
                return;
            }
            if (idade >= 31 && idade <= 40)
            {
                $("#hidFaixaEtaria").val("4");
                $("#spanFaixaEtaria").html("31 a 40 anos");
                return;
            }
            if (idade >= 41 && idade <= 50)
            {
                $("#hidFaixaEtaria").val("6");
                $("#spanFaixaEtaria").html("41 a 50 anos");
                return;
            }
            if (idade >= 51 && idade <= 60)
            {
                $("#hidFaixaEtaria").val("7");
                $("#spanFaixaEtaria").html("51 a 60 anos");
                return;
            }
            if (idade >= 61 && idade <= 70)
            {
                $("#hidFaixaEtaria").val("8");
                $("#spanFaixaEtaria").html("61 a 70 anos");
                return;
            }
            if (idade >= 71 && idade <= 80)
            {
                $("#hidFaixaEtaria").val("9");
                $("#spanFaixaEtaria").html("71 a 80 anos");
                return;
            }
            if (idade >= 81 && idade <= 90)
            {
                $("#hidFaixaEtaria").val("10");
                $("#spanFaixaEtaria").html("81 a 90 anos");
                return;
            }
            if (idade >= 91 && idade <= 100)
            {
                $("#hidFaixaEtaria").val("11");
                $("#spanFaixaEtaria").html("91 a 100 anos");
                return;
            }
        }

        function validaNomeArtistico()
        {
            //nomesArtisticos = getNomesArtisticos();
            for (var i = 0; i < nomesArtisticos.length; i++)
            {
                if (nomesArtisticos[i] == $("#txtNomeArtistico").val().trim().toUpperCase())
                    return false;
            }
            return true;
        }

        function getNomesArtisticos()
        {
            var atores = getAtores();
            nomesArtisticos = [];
            for (var i = 0; i < atores.length; i++)
                nomesArtisticos.push(atores[i].Nome);
            return true;
        }

        function getCidades(p_UF)
        {
            if (p_UF == "EXTERIOR")
                $("#divCidadeNatal").html("<input type='text' id='cboCidadeNatal' name='cboCidadeNatal' class='campo_texto' style='width:100%;'>");
            else
            {
                $("#divCidadeNatal").html("<select id='cboCidadeNatal' class='combo'></select>");
                $("#cboCidadeNatal option").remove();
                jQuery.ajax
                ({
                    type: "get",
                    dataType: "json",
                    url: "https://servicodados.ibge.gov.br/api/v1/localidades/estados/" + p_UF + "/municipios",
                    async: false,
                    success: function (data)
                    {
                        var v_option = new Option("-- Selecione --", "");
                        $("#cboCidadeNatal").append(v_option);
                        if (data.length == 0)
                            $("#cboCidadeNatal").prop("disabled", true);
                        else
                        {
                            for (var i = 0; i < data.length; i++)
                            {
                                v_option = new Option(data[i].nome.toUpperCase(), data[i].nome.toUpperCase());
                                $("#cboCidadeNatal").append(v_option);
                            }
                            $("#cboCidadeNatal").index(0);
                            $("#cboCidadeNatal").focus();
                        }
                    },
                    error: function (data) { },
                });
            }
        }

        function uploadFoto(input)
        {
            if (input.value == "")
            {
                alert("É necessário selecionar uma imagem.");
                return;
            }
            var reader = new FileReader();
            reader.onload = function (e)
            {
                $("#imgAtor").attr("src", e.target.result);
                $("#hidConteudoArquivo").val(e.target.result);
            };
            reader.readAsDataURL(input.files[0]);
        }

                {
                    console.log(e.responseJSON.error);
                    alert("Erro interno - não foi possível o cadastro!");
                }
            });
        }

        function uploadImagem()
        {
            if (event.target.files != null && event.target.files.length != 0)
            {
                var arquivoSelecionado = event.target.files[0];
                var formData = new FormData();
                formData.append("minhaImagem", arquivoSelecionado);
                var xhr = new XMLHttpRequest();
                xhr.open("POST", "/Ator/post", true);
                xhr.send(formData);
            }
        }

        $("#cboUF").change(function () { getCidades(this.value); });

        $("#btnSalvar").click(function () { setAtor(); });

        $("#btnCancelar").click(function () { window.location.href = "listagem.html"; });

        $("input[type=file]").on("change", function () { uploadFoto(this); });

        $("#txtDataNascimento").on("change", function () { getFaixaEtaria(); });

        $("#txtDataFalecimento").on("change", function () { getFaixaEtaria(); });

        $("#txtNomeArtistico").on("blur", function () { validaNomeArtistico(this.value); });

        $(document).ready(function ()
        {
            $("label").css("padding-left", "2px");
            $("#divCidadeNatal").html("<select id='cboCidadeNatal' class='combo' style='width:100%;' disabled></select>");
            preencherCombo(1);
            preencherCombo(2);
            preencherCombo(3);
            preencherCombo(4);
            preencherCombo(5);
            preencherCombo(6);
            getNomesArtisticos();
            $("#imgAtor").attr("src", "../imagens/SEM_FOTO.jpg");
            if (window.location.href.indexOf('?') != -1)
            {
                var URL = window.location.href.split('?');
                if (URL[1] !== undefined)
                    getAtor(URL[1].split('=')[1]);
            }
        });
    </script>
