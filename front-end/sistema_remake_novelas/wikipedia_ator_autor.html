			function getIdade(data_nascimento, data_falecimento)
			{
				var ano_final, mes_final, dia_final;
				var dados_data_nascimento = data_nascimento.split('-');
				var ano_nascimento = parseInt(dados_data_nascimento[0]),
					mes_nascimento = parseInt(dados_data_nascimento[1] - 1),
					dia_nascimento = parseInt(dados_data_nascimento[2]);

				if (data_falecimento == null)
				{
					var data_final = new Date;
					ano_final = data_final.getFullYear();
					mes_final = data_final.getMonth() + 1;
					dia_final = data_final.getDate();
				}
				else
				{
					var dados_data_falecimento = data_falecimento.split('-');
					ano_final = parseInt(dados_data_falecimento[0]);
					mes_final = parseInt(dados_data_falecimento[1] - 1);
					dia_final = parseInt(dados_data_falecimento[2]);
				}
				var idade = ano_final - ano_nascimento;
				if (mes_final < mes_nascimento || mes_final == mes_nascimento && dia_final < dia_nascimento)
					idade--;
				return idade < 0 ? 0 : idade;
			}

			function getDataPorExtenso(data)
			{
				const dias_mes = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
				var dados_data = data.split('-');
				var ano = parseInt(dados_data[0]), mes = parseInt(dados_data[1] - 1), dia = parseInt(dados_data[2]);
				let mesPorExtenso = dias_mes[mes];
				return (dia + " de " + mesPorExtenso + " de " + ano);
			}

			function montarTabelaFilmografia(p_pagina_atual, p_filtro_por_letra)
			{
				$("#tblFilmografia tr").remove(); // reinicializar a tabela
				let linhaTitulo = tabela.insertRow(0);
				// Definindo o título da cada coluna da tabela
				for (let i = 0; i < rotulos.length; i++)
				{
					let celulaTitulo = linhaTitulo.insertCell(i);
					celulaTitulo.id = "T" + (i+1);
					celulaTitulo.className = "celulaTitulo";
					celulaTitulo.innerHTML = rotulos[i];
					celulaTitulo.style.width = larguras[i];
					celulaTitulo.style.textAlign = aligns[i];
					if (celulaTitulo.style.textAlign == "left")
						celulaTitulo.style.paddingLeft = "5px";
					if (celulaTitulo.style.textAlign == "right")
						celulaTitulo.style.paddingRight = "5px";
				}
				$(".celulaTitulo").click(function () { sortTable(this.cellIndex); });

				// Definindo o corpo da tabela
				const pagina_inicio = (p_pagina_atual - 1) * v_qt_registros_por_pagina;
				const pagina_fim    = pagina_inicio + v_qt_registros_por_pagina;
				let dadosPaginados  = dadosProfissional.Filmografia.slice(pagina_inicio, pagina_fim);
				for (let i = 0; i < dadosPaginados.length; i++)
				{
					let celulas = [];
					celulas.push(dadosPaginados[i].Ano + "|center");
					celulas.push(dadosPaginados[i].Titulo + "|left");
					celulas.push(dadosPaginados[i].Personagem + "|left");
					adicionarLinha(celulas);
				}

				// Definindo a linha da paginaçăo
				let linhaPaginacao = tabela.insertRow(dadosPaginados.length+1);
				let celula = linhaPaginacao.insertCell(0);
				celula.className = "paginacao";
				$("td.paginacao").prop("colspan", rotulos.length);
				
				let paginacao = "";
				const v_qt_paginas  = (dadosProfissional.Filmografia.length / v_qt_registros_por_pagina).toFixed(0);
				if (v_qt_paginas <= 1)
					paginacao += "<span style='padding:6px;'></span>";
				else
				{
					for (let i = 1; i <= v_qt_paginas; i++)
					{
						if (i == p_pagina_atual)
							paginacao += "<span class='pagina_atual'>" + p_pagina_atual + "</span>";
						else
						{
							v_qt_linhas = 1;
							paginacao += "<a href='#' onclick='montarTabelaFilmografia(" + i + ", " + p_filtro_por_letra + ");'>" + i + "</a>";
						}
					}
				}
				$("td.paginacao").html(paginacao);
			}

			function adicionarLinha(linhas)
			{
				var linha = tabela.insertRow(1);
				var conteudo = linhas;
				for (var i = 0; i < conteudo.length; i++)
				{
					var dadosConteudo = conteudo[i].split('|');
					var celula = linha.insertCell(i);
					celula.id = "C1" + (i+1);
					celula.className = "celulaConteudo";
					celula.innerHTML = dadosConteudo[0];
					celula.style.textAlign = dadosConteudo[1];
					if (celula.style.textAlign == "left")
						celula.style.paddingLeft = "5px";
					if (celula.style.textAlign == "right")
						celula.style.paddingRight = "5px";
				}
			}

			function definirConteudosAbas(opcaoAba)
			{
				if (opcaoAba == "abaBiografia")
				{
					rotulos  = ["", ""];
					larguras = ["80%", "20%"];
					aligns   = ["justify", "center"];
					if ($("#abaFilmografia").css("visibility") == "visible")	// chamar a função caso a aba corrente não seja única
						montarTabelaBiografia(1, 65);
				}
				else
				{
					v_qt_linhas = 1;
					rotulos  = ["Ano", "Título", "Personagem"];
					larguras = ["20%", "40%", "40%"];
					aligns   = ["center", "left", "left"];
					montarTabelaFilmografia(1, 65);
				}
			}
