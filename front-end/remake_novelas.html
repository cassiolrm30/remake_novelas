			function DefinirDIVs()
			{
				let resultado = "";
				if (titulos.length == 0) return;
				resultado += "<div id='header'>";
				resultado += "  <ul class='abas' type='none'>";
				for (let i = 0; i < titulos.length; i++)
				{
					resultado += "	<li>";
					resultado += "		<div class='aba' id='aba"+titulos[i].num_titulo+"' style='width:"+titulos[i].dsc_largura_aba+"px;background-color:"+titulos[i].dsc_cor_fundo+";color:#000;'>";
					resultado += "		<span>"+titulos[i].dsc_titulo+"</a></span>";
					resultado += "		</div>";
					resultado += "	</li>";
				}
				resultado += "	</ul>";
				resultado += "</div>";
				resultado += "<div id='content'>";
				for (let i = 0; i < titulos.length; i++)
					resultado += "<div class='conteudo' style='background-color:"+titulos[i].dsc_cor_fundo+"' id='divConteudo"+titulos[i].num_titulo+"'></div>";
				resultado += "</div>";
				$(".TabControl").html(resultado);
				$("#content").css("font-family", "Arial");
			}

			function DefinirAbaEConteudo(p_num_titulo)
			{
				let resultado = "";
				let titulo = titulos.find(function (item) { return item.num_titulo == p_num_titulo; });
				let v_dsc_cor_fundo = titulo.dsc_cor_fundo;
				$(".aba").css("border-bottom", "solid 1px #000");					 							 // todas as abas
				$("#aba" + p_num_titulo).css("border-bottom", "solid 1px " + v_dsc_cor_fundo); 					 // apenas a aba selecionada
				$("#content").css("border", "solid 1px #000").css("border-top", "solid 1px " + v_dsc_cor_fundo); // borda do conteúdo
				$("#divConteudo" + p_num_titulo).html($("#div" + p_num_titulo).html());
			}

			function definirConteudosAbas(opcaoAba)
			{
				if (opcaoAba == "abaBiografia")
				{
					rotulos  = ["", ""];
					larguras = ["80%", "20%"];
					aligns   = ["justify", "center"];
					montarTabelaBiografia(1, 65);			
				}
				else
				{
					v_qt_linhas = 1;
					rotulos  = ["Ano", "Título", "Personagem"];
					larguras = ["20%", "40%", "40%"];
					aligns   = ["center", "left", "left"];
					montarTabelaFilmografia(1, 65);			
				}
			}

			$(document).ready(function()
			{
				//MontarMenu();
				DefinirDIVs();
				DefinirAbaEConteudo("1");
				$("#content div:nth-child(1)").show();
				$(".abas li:first div").addClass("ativa");
				$(".aba").click(
					function()
					{
						$(".aba").removeClass("ativa");
						$(this).addClass("ativa");
						let indice = $(this).parent().index();
						indice++;
						$("#content div").hide();
						$("#content div:nth-child("+indice+")").show();
						DefinirAbaEConteudo($(this).prop("id").replace("aba", ""));
					}
				);
			});
